name: CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

# Cancel in-flight runs for the same PR when a new commit is pushed; keep
# main / release / hotfix runs running so we never silently miss a regression
# on a protected branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra scraper --extra stealth --extra push --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # We install every extra so the test suite can import scraper, push and
      # dev modules. We deliberately do NOT run `playwright install chromium`:
      # the unit tests mock the Page object, browser binaries are ~300 MB and
      # add minutes per matrix cell with no test coverage win.
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra scraper --extra stealth --extra push --extra dev

      - name: Run pytest
        run: uv run pytest -v --cov=tomymind --cov-report=term-missing

      - name: CLI smoke test (sources)
        run: uv run tomymind sources

      - name: CLI smoke test (help)
        run: uv run tomymind --help

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: |
          uv tool run --from twine twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
