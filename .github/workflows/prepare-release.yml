name: Prepare release

# Manually triggered to start a new release. Given a target version
# (e.g. 0.2.0), this workflow:
#
#   1. Creates a `release/x.y` branch off `main` (e.g. `release/0.2`).
#      If the branch already exists, the workflow fails fast so we
#      never silently rewrite stabilization branches.
#   2. Bumps `__version__` in `src/tomymind/__init__.py`.
#   3. Promotes the `[Unreleased]` block in `CHANGELOG.md` to a dated
#      `[x.y.z]` section and updates the comparison links at the
#      bottom of the file.
#   4. Pushes the branch.
#
# The maintainer then reviews the branch (and pushes any final
# stabilization commits on top), and tags `vx.y.z` to trigger the
# `Release` workflow.
#
# For an out-of-band patch on an already-released minor whose
# `release/x.y` branch is gone, use `prepare-hotfix.yml` instead.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version, semver MAJOR.MINOR.PATCH (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Create release/x.y branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not valid semver (MAJOR.MINOR.PATCH)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Compute branch name
        id: vars
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          MINOR="$(echo "$VERSION" | cut -d. -f1,2)"
          BRANCH="release/${MINOR}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Target branch: ${BRANCH} (for version ${VERSION})"

      - name: Verify branch does not already exist
        shell: bash
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "::error::Branch ${BRANCH} already exists on origin. To add a patch (e.g. 0.2.1), push commits directly to ${BRANCH} and tag from there. To restart a release, delete the branch first."
            exit 1
          fi

      - name: Create release branch
        shell: bash
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          git checkout -b "${BRANCH}"

      - name: Bump version and update changelog
        shell: bash
        env:
          NEW_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          python <<'PY'
          from __future__ import annotations
          import datetime
          import os
          import pathlib
          import re

          new_version = os.environ["NEW_VERSION"]
          today = datetime.date.today().isoformat()

          init_path = pathlib.Path("src/tomymind/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          if not match:
              raise SystemExit(f"Could not find __version__ in {init_path}")
          old_version = match.group(1)
          if old_version == new_version:
              raise SystemExit(f"__version__ is already {new_version} - nothing to bump")
          init_path.write_text(
              init_text.replace(
                  f'__version__ = "{old_version}"',
                  f'__version__ = "{new_version}"',
                  1,
              ),
              encoding="utf-8",
          )
          print(f"Bumped __version__: {old_version} -> {new_version}")

          changelog_path = pathlib.Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")

          # 1. Replace `## [Unreleased]` with `## [Unreleased]\n\n## [X.Y.Z] - YYYY-MM-DD`
          #    so the content that was under [Unreleased] becomes the body of the new section.
          unreleased_marker = "## [Unreleased]"
          if unreleased_marker not in changelog:
              raise SystemExit(f"Could not find '{unreleased_marker}' in {changelog_path}")
          new_section_header = f"{unreleased_marker}\n\n## [{new_version}] — {today}"
          changelog = changelog.replace(unreleased_marker, new_section_header, 1)

          # 2. Rewrite link refs at the bottom: redirect [Unreleased] to compare against the new
          #    tag, and add a [X.Y.Z] link.
          repo = "https://github.com/akhalildjo/tomymind"
          old_unreleased_link_pattern = re.compile(
              r"^\[Unreleased\]:\s*" + re.escape(repo) + r"/compare/v[^.]+\.[^.]+\.[^.]+\.\.\.HEAD\s*$",
              re.MULTILINE,
          )
          new_unreleased_link = f"[Unreleased]: {repo}/compare/v{new_version}...HEAD"
          if old_unreleased_link_pattern.search(changelog):
              changelog = old_unreleased_link_pattern.sub(new_unreleased_link, changelog, count=1)
          else:
              # Best-effort fallback: append at end if pattern not found.
              if not changelog.endswith("\n"):
                  changelog += "\n"
              changelog += new_unreleased_link + "\n"

          new_version_link = f"[{new_version}]: {repo}/compare/v{old_version}...v{new_version}"
          # Insert the new version link right after the [Unreleased] link line.
          changelog = re.sub(
              r"(^\[Unreleased\]:[^\n]*\n)",
              r"\1" + new_version_link + "\n",
              changelog,
              count=1,
              flags=re.MULTILINE,
          )

          changelog_path.write_text(changelog, encoding="utf-8")
          print(f"CHANGELOG.md updated for {new_version}")
          PY

      - name: Commit and push
        shell: bash
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
          NEW_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tomymind/__init__.py CHANGELOG.md
          git commit -m "chore(release): prepare v${NEW_VERSION}"
          git push -u origin "${BRANCH}"

      - name: Summary
        shell: bash
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
          NEW_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          {
            echo "## Release prepared"
            echo ""
            echo "- Branch: \`${BRANCH}\`"
            echo "- Version: \`${NEW_VERSION}\`"
            echo ""
            echo "### Next steps"
            echo ""
            echo "1. Review the bump commit on \`${BRANCH}\` and push any final stabilization commits."
            echo "2. Tag and push to trigger the Release workflow:"
            echo "   \`\`\`"
            echo "   git fetch origin"
            echo "   git checkout ${BRANCH}"
            echo "   git tag v${NEW_VERSION}"
            echo "   git push origin v${NEW_VERSION}"
            echo "   \`\`\`"
            echo "3. The \`backmerge\` workflow will open a PR back to \`main\` once the tag is published."
          } >> "$GITHUB_STEP_SUMMARY"
