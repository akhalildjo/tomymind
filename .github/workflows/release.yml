name: Release

# Triggered when a maintainer pushes a `v*` tag (e.g. `v0.2.0`).
#
# In the pragmatic gitflow we follow, tags must live on a `release/x.y`
# branch (initial release of a minor + subsequent patches on the same
# minor) or a `hotfix/x.y.z` branch (out-of-band patch off an older
# release). Tagging directly off `main` is rejected so we never ship
# a version that hasn't been through a stabilization branch.
#
# The job verifies that the tag matches the package version declared in
# src/tomymind/__init__.py before building, so a typo in either place
# fails fast instead of producing a mislabelled release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so we can resolve which branch contains the tag.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify tag is on a release/* or hotfix/* branch
        shell: bash
        run: |
          TAG_SHA="$(git rev-parse HEAD)"
          # Fetch every remote branch so `git branch -r --contains` sees
          # release/* and hotfix/* even if the runner only cloned the tag ref.
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          BRANCHES="$(git branch -r --contains "$TAG_SHA" | sed -e 's/^[[:space:]]*//' -e '/->/d')"
          echo "Branches containing $TAG_SHA:"
          echo "$BRANCHES"
          if ! echo "$BRANCHES" | grep -qE '^origin/(release|hotfix)/'; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} must be on a release/x.y or hotfix/x.y.z branch. Found: $BRANCHES"
            exit 1
          fi

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(uv run --no-project python -c 'import re,pathlib; print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", pathlib.Path("src/tomymind/__init__.py").read_text(encoding="utf-8")).group(1))')"
          echo "Tag:     $TAG"
          echo "Package: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG does not match package version $PKG_VERSION in src/tomymind/__init__.py"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uv tool run --from twine twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            dist/*
