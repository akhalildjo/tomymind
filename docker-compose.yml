# Local stack for tomymind phase 2.
#
# - nats: JetStream broker. Scrapers publish BookmarkDiscovered events here.
# - importer: consumes events and POSTs them to the mymind /objects API.
#
# Scrapers themselves stay on the host (the `tomymind login` flow needs a
# visible Chromium window — see CLAUDE.md "Portability"). Only the headless
# pieces run in containers.

services:
  nats:
    image: nats:2.10-alpine
    container_name: tomymind-nats
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  importer:
    build:
      context: .
      dockerfile: docker/Dockerfile.importer
    image: tomymind/mymind-importer:dev
    container_name: tomymind-importer
    environment:
      NATS_URL: nats://nats:4222
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MYMIND_API_BASE: ${MYMIND_API_BASE:-https://api.mymind.com}
      MYMIND_API_KEY_ID: ${MYMIND_API_KEY_ID:-}
      MYMIND_API_KEY_SECRET: ${MYMIND_API_KEY_SECRET:-}
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nats-data:
