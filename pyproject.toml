[project]
name = "tomymind"
dynamic = ["version"]
description = "Multi-source bookmark importer for mymind.com"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "tomymind contributors" },
]
keywords = [
    "mymind",
    "bookmarks",
    "importer",
    "scraper",
    "playwright",
    "twitter",
    "x",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
]

[project.urls]
Homepage = "https://github.com/akhalildjo/tomymind"
Repository = "https://github.com/akhalildjo/tomymind"
Issues = "https://github.com/akhalildjo/tomymind/issues"
Changelog = "https://github.com/akhalildjo/tomymind/blob/main/CHANGELOG.md"

[project.optional-dependencies]
scraper = [
    "playwright>=1.49",
    "typer>=0.13",
    "python-dotenv>=1.0",
]
stealth = ["tf-playwright-stealth>=1.1.0"]
push = [
    "httpx>=0.27",
    "pyjwt>=2.9",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
tomymind = "tomymind.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: src/tomymind/__init__.py.
# Bumping that file is enough — hatchling picks it up at build time and
# the release workflow verifies the git tag matches it before publishing.
[tool.hatch.version]
path = "src/tomymind/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tomymind"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer requires typer.Option / typer.Argument calls in function defaults.
"src/tomymind/cli.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
