[project]
name = "tomymind"
version = "0.1.0"
description = "Multi-source bookmark importer for mymind.com"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.49",
    "pydantic>=2.9",
    "typer>=0.13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
stealth = ["tf-playwright-stealth>=1.1.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
tomymind = "tomymind.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tomymind"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
